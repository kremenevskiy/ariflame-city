name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: node tools/gen_tracks.cjs --check

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest server/tests -q -p no:cacheprovider

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci && npx playwright install --with-deps chromium
      - run: pip install -r server/requirements.txt
      - name: Игровой сервер и клиент
        run: |
          (cd server && FC_DB=/tmp/fcg/game.db nohup uvicorn app:app --host 127.0.0.1 --port 8091 --ws websockets > /tmp/fcg.log 2>&1 &)
          nohup node tools/dev-server.cjs > /tmp/dev.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/g/health && break; sleep 1; done
      - run: node tools/check/smoke.cjs --phone
