# Проверки каждого PR и каждого коммита в main. Работает без секретов и с правами только на чтение — так безопасно
# запускать код из чужих форков. Всё, что требует секретов (превью, комментарий в PR, выпуск), делают отдельные
# workflow по событию workflow_run и берут отсюда только артефакты как данные (pr-report.yml, release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # правки с сайта (contrib-intake.yml): PR открывает бот, а PR от GITHUB_TOKEN сам CI не запускает — запуск вручную
  workflow_dispatch:
    inputs:
      pr:
        description: "Номер PR (правка с сайта)"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr || github.sha }}
  cancel-in-progress: true

jobs:
  guard:
    name: Сторож содержания
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Сторож из базовой ветки (PR не может ослабить его под себя)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch -q origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/guard" report
          for f in content-guard.cjs words.cjs only-better.cjs; do
            git show "origin/$BASE_REF:tools/check/$f" > "$RUNNER_TEMP/guard/$f" 2>/dev/null || cp "tools/check/$f" "$RUNNER_TEMP/guard/$f"
          done
          GUARD_JSON=report/guard.json node "$RUNNER_TEMP/guard/content-guard.cjs" "origin/$BASE_REF"
      - name: Номер PR и коммит — для отчёта (pr-report.yml сверяет их сам)
        if: always()
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr || 'null' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p report && echo "{\"pr\": $PR, \"sha\": \"$SHA\"}" > report/pr.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard
          path: report/
          retention-days: 7

  lint:
    name: Линтер и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 300   # история — для changes.json («Что нового», лента правок) и status.json; с глубиной 1 там одна запись
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: node tools/gen_tracks.cjs --check
      - run: npm run build
      - name: Сборка — для превью и выпуска (без config.js выкладки и без закрытых пакетов)
        run: tar -czf dist.tgz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tgz
          retention-days: 7

  server:
    name: Тесты сервера
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest server/tests -q -p no:cacheprovider

  smoke:
    name: Игра в браузере (оба города и телефон)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci && npx playwright install --with-deps chromium
      - run: pip install -r server/requirements.txt
      - name: Игровой сервер и клиент
        run: |
          (cd server && FC_DB=/tmp/fcg/game.db nohup uvicorn app:app --host 127.0.0.1 --port 8091 --ws websockets > /tmp/fcg.log 2>&1 &)
          nohup node tools/dev-server.cjs > /tmp/dev.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/g/health && break; sleep 1; done
      - run: node tools/check/smoke.cjs --phone --shots shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
          retention-days: 7
